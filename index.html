<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lern-Dashboard Sprechprüfung Englisch</title>
<style>
body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:20px; }
.container { max-width: 1000px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
h1 { margin-top:0; }
.grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:16px; }
.card { border:1px solid #ddd; border-radius:10px; padding:14px; }
button { padding:8px 12px; border:none; border-radius:6px; cursor:pointer; }
button.primary { background:#2563eb; color:white; }
button.secondary { background:#16a34a; color:white; }
button.ghost { background:#e5e7eb; }
button:disabled { opacity:.5; cursor:not-allowed; }
.progress { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-bottom:6px; }
.progress-bar { height:100%; background:#2563eb; width:0%; }
img { max-width:100%; border-radius:8px; margin:10px 0; }
.help { margin-top:12px; padding:12px; border:1px dashed #999; border-radius:8px; background:#fafafa; }
.stars { font-size:20px; }
.timer { font-weight:bold; margin-top:6px; }
</style>
</head>
<body>
<div class="container">
<h1>Lern-Dashboard: Sprechprüfung Englisch (Jg. 8)</h1>

<div class="grid" id="overview"></div>
<hr>
<div class="card" id="exercise">
<p>Starte eine Übung, um zu beginnen.</p>
</div>
</div>

<script>
const MAX_ATTEMPTS = 6;

const pictureImages = Array.from({length:17}, (_,i) =>
  `https://gretel-bergmann-schule.de/iserv/file/-/Public/English%20Speaking%20Test/picture${i+1}.png`
);

const parts = {
  personal: { title: "About Me", time: 60, questions: ["What's your favourite film? Give reasons.","Talk about your family.","What do you like to do in your free time?"],
    help:["My favourite ... is ... because ...","One reason is that ...","Another reason is ...","In my opinion, ...","I really like ...","I don't like ... at all because ...","In my free time, I often ...","I usually ... at the weekend.","For me, ... is important because ..."]},
  picture: { title: "Describing Pictures", time: 120, questions:["Describe the picture. What is happening?"], images:pictureImages,
    help:["In the picture I can see ...","In the background there is / there are ...","In the foreground, I can see ...","In the middle of the picture ...","At the top / bottom of the picture ...","The people are ... (present progressive)","They look ... because ...","The picture shows ...","In my opinion, the picture is about ..."]},
  discussion: { title: "Discussion", time: 240, questions:["Plan a trip to the USA together."],
    help:["In my opinion, ...","I agree with you, but ...","I don't agree because ...","On the one hand ..., on the other hand ...","What do you think about ...?","That's a good idea because ...","Maybe we could ...","Let's decide on ...","I would prefer ... because ..."]}
};

let state={part:null,attempts:{personal:0,picture:0,discussion:0},resets:{personal:0,picture:0,discussion:0},fresh:false,showHelp:false,currentQuestion:null,currentImage:null,timeLeft:null,timerId:null};

function rand(a){return a[Math.floor(Math.random()*a.length)];}
function stars(p){return Math.min(5,state.resets[p]+1);}
function motivation(s){return ["Du hast es ausprobiert – guter erster Schritt ⭐","Du reflektierst dein Lernen – stark! ⭐⭐","Du arbeitest gezielt an Verbesserungen ⭐⭐⭐","Sehr professionell! Du trainierst strategisch ⭐⭐⭐⭐","Top! Genau so lernen Profis ⭐⭐⭐⭐⭐"][s-1];}

function startTimer(sec){
  clearInterval(state.timerId);
  state.timeLeft=sec;
  state.timerId=setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){clearInterval(state.timerId);state.timeLeft=0;}
    renderExercise();
  },1000);
}

const overview=document.getElementById("overview");
const exercise=document.getElementById("exercise");

function renderOverview(){
  overview.innerHTML="";
  Object.keys(parts).forEach(k=>{
    overview.innerHTML+=`<div class="card"><h3>${parts[k].title}</h3>
    <div class="progress"><div class="progress-bar" style="width:${state.attempts[k]/MAX_ATTEMPTS*100}%"></div></div>
    <p>Durchgänge: ${state.attempts[k]} / ${MAX_ATTEMPTS}</p><p>Resets: ${state.resets[k]}</p>
    <button class="primary" onclick="start('${k}')">Übung starten</button></div>`;
  });
}

function renderExercise(){
  if(!state.part){exercise.innerHTML='<p>Starte eine Übung, um zu beginnen.</p>';return;}
  const p=parts[state.part];
  exercise.innerHTML=`<h2>${p.title}</h2><p>${state.currentQuestion}</p>
  ${state.currentImage?`<img src="${state.currentImage}">`:""}
  <p class="timer">⏱️ ${state.timeLeft}s</p>
  <button class="ghost" ${state.attempts[state.part]<MAX_ATTEMPTS?'disabled':''} onclick="resetProgress()">🔄 Neu starten</button>
  <button class="primary" onclick="nextQuestion()">Nächste Frage</button>
  <button class="secondary" ${!state.fresh?'disabled':''} onclick="markDone()">Als gemacht markieren</button>
  <div class="stars">${"⭐".repeat(stars(state.part))}</div><p>${motivation(stars(state.part))}</p>
  <button class="ghost" onclick="toggleHelp()">${state.showHelp?'❌ Hilfe ausblenden':'❓ Hilfe & Formulierungen anzeigen'}</button>
  ${state.showHelp?`<div class="help"><ul>${p.help.map(h=>`<li>${h}</li>`).join("")}</ul></div>`:""}`;
}

function start(part){state.part=part;state.fresh=true;state.showHelp=false;state.currentQuestion=rand(parts[part].questions);state.currentImage=parts[part].images?rand(parts[part].images):null;startTimer(parts[part].time);renderExercise();}
function nextQuestion(){start(state.part);}
function markDone(){if(!state.fresh)return;state.attempts[state.part]++;state.fresh=false;renderOverview();renderExercise();}
function resetProgress(){if(state.attempts[state.part]<MAX_ATTEMPTS)return;state.attempts[state.part]=0;state.resets[state.part]++;renderOverview();renderExercise();}
function toggleHelp(){state.showHelp=!state.showHelp;renderExercise();}

renderOverview();
</script>
</body>
</html>

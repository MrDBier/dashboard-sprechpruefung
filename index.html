<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lern-Dashboard Sprechprüfung Englisch</title>

<style>
body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:20px; }
.container { max-width:1000px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
h1 { margin-top:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
.card { border:1px solid #ddd; border-radius:10px; padding:14px; }
button { padding:8px 12px; border:none; border-radius:6px; cursor:pointer; }
button.primary { background:#2563eb; color:white; }
button.secondary { background:#16a34a; color:white; }
button.ghost { background:#e5e7eb; }
button:disabled { opacity:.5; cursor:not-allowed; }
.progress { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-bottom:6px; }
.progress-bar { height:100%; background:#2563eb; width:0%; }
img { max-width:100%; border-radius:8px; margin:10px 0; }
.help { margin-top:12px; padding:12px; border:1px dashed #999; border-radius:8px; background:#fafafa; }
.stars { font-size:20px; margin-top:6px; }
.timer { font-weight:bold; margin-top:6px; }
</style>
</head>

<body>
<div class="container">
<h1>Lern-Dashboard: Sprechprüfung Englisch (Jg. 8)</h1>

<div class="grid" id="overview"></div>
<hr>
<div class="card" id="exercise">
<p>Starte eine Übung, um zu beginnen.</p>
</div>
</div>

<script>
const MAX_ATTEMPTS = 6;

const pictureImages = Array.from({ length: 17 }, (_, i) =>
  `https://mrdbier.github.io/dashboard-sprechpruefung/images/picture${i + 1}.png`
);

const parts = {
  personal: {
    title: "About Me",
    time: 60,
    questions: [
  "What is your favourite film? Give reasons.",
  "Who is your favourite actor or actress? Give reasons.",
  "What is your favourite book or comic? What is it about? What do you like about it?",
  "What is your favourite song? What is it about? What do you like about it?",
  "What is your favourite series? What is it about? What do you like about it?",
  "What is your favourite videogame? Give reasons.",
  "What is your favourite subject? And what subject do you not like at all? Give reasons.",
  "What do you like about your school? And what would you like to change? Give reasons.",
  "What is your favourite sport? How often do you practise it? What do you like about it?",
  "What do you like to do in your free time? Say how often you do things, where, and with whom.",
  "What are your favourite clothes? And what clothes don’t you like at all? Give reasons.",
  "Talk about your family and/or your friends.",
  "Have you got a pet? If so, talk about it. If not: Would you like to have one? Why or why not?",
  "What is your favourite food? And what do you not like at all? Give reasons.",
  "Where would you like to travel to? Give reasons.",
  "What is your favourite band or who is your favourite singer? Give reasons."
    ],
    help: [
      "My favourite ... is ... because ...",
      "One reason is that ...",
      "Another reason is ...",
      "In my opinion, ...",
      "I really like ...",
      "I don't like ... at all because ...",
      "In my free time, I often ...",
      "At the weekend, I usually ..."
    ]
  },

  picture: {
    title: "Describing Pictures",
    time: 120,
    questions: ["Describe the picture. What is happening?"],
    images: pictureImages,
    help: [
      "In the picture I can see ...",
      "In the background there is / there are ...",
      "In the foreground ...",
      "The people are ... (present progressive)",
      "They look ... because ...",
      "The picture shows ...",
      "In my opinion, the picture is about ..."
    ]
  },

  discussion: {
    title: "Discussion",
    time: 240,
    questions: [
      "Plan a trip to the USA together. Discuss destination, budget and activities.",
      "Should school uniforms be mandatory? Discuss pros and cons.",
      "Is social media more helpful or harmful for teenagers?",
      "How can we make our town more environmentally friendly?",
      "Should students have homework every day?",
      "Is it better to study abroad for a year?",
      "How should schools prepare students for future jobs?",
      "Should mobile phones be allowed in lessons?"
    ],
    help: [
      "In my opinion, ...",
      "I agree with you, but ...",
      "I don't agree because ...",
      "On the one hand ..., on the other hand ...",
      "What do you think about ...?",
      "That's a good idea because ...",
      "Maybe we could ...",
      "Let's decide on ..."
    ]
  }
};

let state = {
  part: null,
  attempts: { personal:0, picture:0, discussion:0 },
  resets: { personal:0, picture:0, discussion:0 },
  fresh: false,
  showHelp: false,
  currentQuestion: null,
  currentImage: null,
  timeLeft: null,
  timerId: null,

  questionPool: [],
  questionIndex: 0
};

function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function stars(p){ return Math.min(5, state.resets[p] + 1); }
function motivation(s){
  return [
    "Guter Start ⭐",
    "Du arbeitest reflektiert ⭐⭐",
    "Sehr konzentriert ⭐⭐⭐",
    "Professionelles Training ⭐⭐⭐⭐",
    "Top! Genau so lernen Profis ⭐⭐⭐⭐⭐"
  ][s-1];
}

function startTimer(sec){
  clearInterval(state.timerId);
  state.timeLeft = sec;
  state.timerId = setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      state.timeLeft = 0;
    }
    renderExercise();
  },1000);
}

const overview = document.getElementById("overview");
const exercise = document.getElementById("exercise");

function renderOverview(){
  overview.innerHTML = "";
  Object.keys(parts).forEach(k=>{
    overview.innerHTML += `
      <div class="card">
        <h3>${parts[k].title}</h3>
        <div class="progress">
          <div class="progress-bar" style="width:${state.attempts[k]/MAX_ATTEMPTS*100}%"></div>
        </div>
        <p>Durchgänge: ${state.attempts[k]} / ${MAX_ATTEMPTS}</p>
        <p>Resets: ${state.resets[k]}</p>
        <button class="primary" onclick="start('${k}')">Übung starten</button>
      </div>`;
  });
}

function start(part){
  state.part = part;
  state.fresh = true;
  state.showHelp = false;

  state.questionPool = [...parts[part].questions]
    .sort(() => Math.random() - 0.5);
  state.questionIndex = 0;

  state.currentQuestion = state.questionPool[0];
  state.currentImage = parts[part].images ? rand(parts[part].images) : null;

  startTimer(parts[part].time);
  renderExercise();
}

function nextQuestion(){
  if(state.questionIndex >= state.questionPool.length - 1) return;

  state.questionIndex++;
  state.currentQuestion = state.questionPool[state.questionIndex];
  state.fresh = true;

  if(parts[state.part].images){
    state.currentImage = rand(parts[state.part].images);
  }

  startTimer(parts[state.part].time);
  renderExercise();
}

function markDone(){
  if(!state.fresh) return;
  state.attempts[state.part]++;
  state.fresh = false;
  renderOverview();
  renderExercise();
}

function resetProgress(){
  if(state.attempts[state.part] < MAX_ATTEMPTS) return;

  state.attempts[state.part] = 0;
  state.resets[state.part]++;
  state.questionPool = [];
  state.questionIndex = 0;
  state.currentQuestion = null;
  state.currentImage = null;
  state.part = null;

  renderOverview();
  renderExercise();
}

function toggleHelp(){
  state.showHelp = !state.showHelp;
  renderExercise();
}

function renderExercise(){
  if(!state.part){
    exercise.innerHTML = "<p>Starte eine Übung, um zu beginnen.</p>";
    return;
  }

  const p = parts[state.part];
  exercise.innerHTML = `
    <h2>${p.title}</h2>
    <p>${state.currentQuestion}</p>
    ${state.currentImage ? `<img src="${state.currentImage}">` : ""}
    <p class="timer">⏱️ ${state.timeLeft}s</p>

    <button class="ghost"
      ${state.attempts[state.part] < MAX_ATTEMPTS ? "disabled" : ""}
      onclick="resetProgress()">🔄 Neu starten</button>

    <button class="primary"
      ${state.questionIndex >= state.questionPool.length - 1 ? "disabled" : ""}
      onclick="nextQuestion()">Nächste Frage</button>

    <button class="secondary"
      ${!state.fresh ? "disabled" : ""}
      onclick="markDone()">Als gemacht markieren</button>

    <div class="stars">${"⭐".repeat(stars(state.part))}</div>
    <p>${motivation(stars(state.part))}</p>

    <button class="ghost" onclick="toggleHelp()">
      ${state.showHelp ? "❌ Hilfe ausblenden" : "❓ Hilfe & Formulierungen anzeigen"}
    </button>

    ${state.showHelp ? `<div class="help"><ul>${p.help.map(h=>`<li>${h}</li>`).join("")}</ul></div>` : ""}
  `;
}

renderOverview();
</script>
</body>
</html>
